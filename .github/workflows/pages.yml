name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 没有构建步骤：仓库里跑的就是线上跑的（纯 ESM，零依赖，无打包器），所以站点是一次文件拷贝。
      # 名单是"首页与 css 真实引用到的每一字节"，逐条对过：index.html 引 css/game.css、js/main.js、
      # js/pwa.js、manifest.json、icons/*.png；css/game.css 引 ../textures/washi-512.png；
      # js/ 里没有任何动态 import，出题用的 js/gen-worker.js 与画布纸纹 textures/paper-256.png
      # 分别住在 js/ 与 textures/ 里、都在名单内。
      # 少列一样就是线上 404：图标裂图比没图标更坏（安装面板与分享卡各拿一张裂的），
      # sw.js 缺了就是"能打开、永远装不上"，而且这两样在本地 root 形态下都发现不了——
      # 本地那台 server.cjs 发的是整棵仓库。
      # 用 `path: .` 会把 server.cjs、tools/（里面躺着 tools/fixtures.js = 每张夹具盘的手推答案与
      # 出货对照的样本串）、tests/、assets/gen/（出图脚本，不是运行字节）和 *.md 一起传上去
      # —— ci.yml 里那几条"必须 404"拦的就是这个。
      - name: Assemble static site
        run: |
          mkdir _site
          cp index.html manifest.json sw.js _site/
          cp -r css js icons textures _site/
      # configure-pages@v5：本仓此前没有 Pages 站点，这一步会顺手建一个。
      # deploy-pages@v4 + upload-pages-artifact@v3 是配套的——早先用 deploy-pages@v3 时
      # 出现过"CI 绿、站点 404"（取不到 artifact），同组织其他仓踩过。
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
