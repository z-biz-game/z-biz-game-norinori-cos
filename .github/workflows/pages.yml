name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 没有构建步骤：仓库里跑的就是线上跑的（纯 ESM，零依赖，无打包器），所以站点是一次文件拷贝。
      # 名单只有这三样，而且是逐条对过的：index.html 只引用 css/game.css 与 js/main.js
      # （favicon 是内联 `data:,`，Chrome 依旧会自己探一次 /favicon.ico —— 那是它的行为，
      # 本仓没有那个文件，页面也没有任何元素在等它，所以闸里那条"无资源 404"判据照旧站得住）；
      # js/ 里没有任何动态 import，出题用的 js/gen-worker.js 就住在 js/ 里、在名单内。
      # 用 `path: .` 会把 server.cjs、tools/（里面躺着 tools/fixtures.js = 每张夹具盘的手推答案与
      # 出货对照的样本串）、tests/ 和 *.md 一起传上去 —— ci.yml 里那四条"必须 404"拦的就是这个。
      - name: Assemble static site
        run: |
          mkdir _site
          cp index.html _site/
          cp -r css js _site/
      # configure-pages@v5：本仓此前没有 Pages 站点，这一步会顺手建一个。
      # deploy-pages@v4 + upload-pages-artifact@v3 是配套的——早先用 deploy-pages@v3 时
      # 出现过"CI 绿、站点 404"（取不到 artifact），同组织其他仓踩过。
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
